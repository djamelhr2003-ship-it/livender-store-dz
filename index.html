                            <div class="btn-group">
                                <button onclick='handleDirectAction(${JSON.stringify(p).replace(/'/g, "&apos;")}, ${p.frontQty || 1})' class="btn-cart" ${stockVal <= 0 ? 'disabled':''}>أضف للسلة 🛒</button>
                                <button onclick='openProductDetailsPage(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="btn-buy" ${stockVal <= 0 ? 'disabled':''}>اطلب الآن ⚡</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.handleDirectAction = function(product, qty) {
            let offer = getActiveOfferForProduct(product.name);
            let activePrice = offer.hasOffer ? offer.newPrice : product.price;

            if((product.category === 'ألبسة وملابس' || product.category === 'أكسسوارات') && (product.colors || product.sizes)) {
                openProductDetailsPage(product);
                return;
            }
            let existing = cart.find(item => item.id === product.id);
            if(existing) existing.quantity += qty;
            else cart.push({ id: product.id, productName: product.name, price: activePrice, quantity: qty, imageUrl: product.imageUrls?.[0] || '' });
            
            saveCartToStorage();
            renderProducts(allProducts);
            openCartPage();
        }

        window.openProductDetailsPage = function(product) {
            currentOpenedProduct = product;
            let offer = getActiveOfferForProduct(product.name);
            currentSelectedPrice = offer.hasOffer ? offer.newPrice : product.price;
            currentQty = 1; selectedColor = ''; selectedSize = '';

            let images = product.imageUrls && product.imageUrls.length > 0 ? product.imageUrls : ['https://via.placeholder.com/200'];
            
            let galleryHtml = `<div class="media-gallery">`;
            images.forEach((img, idx) => { galleryHtml += `<img src="${img}" class="gallery-thumb ${idx===0?'active':''}" onclick="setMainMedia('${img}', this)">`; });
            galleryHtml += `</div>`;

            let priceDisplay = offer.hasOffer ? `
                <span style="text-decoration:line-through; color:#9ca3af; font-size:14px;">${offer.oldPrice} دج</span>
                <span style="color:#e11d48; font-size:20px; font-weight:bold; margin-right:8px;">${offer.newPrice} دج</span>
            ` : `<span style="color:#e11d48; font-size:20px; font-weight:bold;">${product.price} دج</span>`;

            let variantsHtml = '';
            if(product.colors) {
                variantsHtml += '<label style="font-size:12px; margin-top:10px;">اختر اللون:</label><div style="display:flex; gap:5px; flex-wrap:wrap;">';
                product.colors.split(',').forEach(c => { variantsHtml += `<span class="variant-pill" onclick="selectVariant('color', '${c.trim()}', this)">${c.trim()}</span>`; });
                variantsHtml += '</div>';
            }
            if(product.sizes) {
                variantsHtml += '<label style="font-size:12px; margin-top:10px;">اختر المقاس:</label><div style="display:flex; gap:5px; flex-wrap:wrap;">';
                product.sizes.split(',').forEach(s => { variantsHtml += `<span class="variant-pill" onclick="selectVariant('size', '${s.trim()}', this)">${s.trim()}</span>`; });
                variantsHtml += '</div>';
            }

            document.getElementById('product-details-content').innerHTML = `
                <img src="${images[0]}" class="main-media-view" id="mainImageDisplay" onclick="openZoom(this.src)">
                ${galleryHtml}
                <h3 class="dz-nt" style="margin:10px 0; font-size:18px;">${pName(product)}</h3>
                <div style="margin-bottom:10px;">${priceDisplay}</div>
                <p class="dz-nt" style="font-size:14px; color:#555; line-height:1.6; white-space:pre-line;">${pDesc(product) || tr('لا يوجد وصف متاح.')}</p>
                ${variantsHtml}
                <div class="qty-container" style="margin:15px 0;">
                    <span>الكمية:</span>
                    <button class="qty-btn" onclick="adjustDetailQty(-1)">-</button>
                    <b id="detail-qty-val">1</b>
                    <button class="qty-btn" onclick="adjustDetailQty(1)">+</button>
                </div>
                <button onclick="addToCartFromDetails()" style="background:#2563eb; color:white; width:100%; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">إضافة إلى السلة وإتمام الطلب ⚡</button>
            `;
            switchPage('product-details-page');
        }

        window.setMainMedia = function(url, el) {
            document.getElementById('mainImageDisplay').src = url;
            document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        window.openZoom = function(src) {
            document.getElementById('zoomModalImg').src = src;
            document.getElementById('zoomModal').style.display = 'flex';
        }
        window.closeZoomModal = function() { document.getElementById('zoomModal').style.display = 'none'; }

        window.selectVariant = function(type, val, el) {
            if(type === 'color') { selectedColor = val; document.querySelectorAll('#product-details-content span[onclick*="color"]').forEach(e=>e.classList.remove('selected')); }
            if(type === 'size') { selectedSize = val; document.querySelectorAll('#product-details-content span[onclick*="size"]').forEach(e=>e.classList.remove('selected')); }
            el.classList.add('selected');
        }

        window.adjustDetailQty = function(delta) {
            currentQty = Math.max(1, currentQty + delta);
            let valEl = document.getElementById('detail-qty-val');
            if(valEl) valEl.innerText = currentQty;
        }

        window.addToCartFromDetails = function() {
            if((currentOpenedProduct.colors && !selectedColor) || (currentOpenedProduct.sizes && !selectedSize)) {
                alert('يرجى اختيار اللون والمقاس أولاً!'); return;
            }
            cart.push({
                id: currentOpenedProduct.id,
                productName: currentOpenedProduct.name,
                price: currentSelectedPrice,
                quantity: currentQty,
                color: selectedColor,
                size: selectedSize,
                imageUrl: currentOpenedProduct.imageUrls?.[0] || ''
            });
            saveCartToStorage();
            openCartPage();
        }

        window.openCartPage = function() {
            currentDiscount = 0; currentCoupon = null;
            let container = document.getElementById('cart-page-content');
            if(cart.length === 0) {
                container.innerHTML = '<h3>🛒 سلة الشراء فارغة</h3><button onclick="switchPage(\'home-page\')" style="background:#2563eb; color:white; padding:10px; border:none; border-radius:6px;">العودة للتسوق</button>';
                switchPage('cart-page');
                return;
            }

            let itemsHtml = '';
            let subtotal = 0;
            cart.forEach((item, idx) => {
                subtotal += item.price * item.quantity;
                let variantTxt = (item.color || item.size) ? ` [اللون: ${item.color || '-'} | المقاس: ${item.size || '-'}]` : '';
                itemsHtml += `
                    <div style="display:flex; gap:10px; align-items:center; background:#f8fafc; padding:10px; border-radius:8px; margin-bottom:8px;">
                        <img src="${item.imageUrl}" style="width:50px; height:50px; object-fit:cover; border-radius:6px;">
                        <div style="flex:1;">
                            <h4 style="margin:0; font-size:14px;">${item.productName} ${variantTxt}</h4>
                            <span style="color:#e11d48; font-weight:bold;">${item.price} دج × ${item.quantity}</span>
                        </div>
                        <button onclick="removeFromCart(${idx})" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">حذف 🗑️</button>
                    </div>
                `;
            });

            let wilayasOptions = '<option value="">-- اختر ولايتك --</option>';
            algeriaWilayas.forEach(w => { wilayasOptions += `<option value="${w.name}">${w.code} - ${LANG === 'fr' ? w.fr : w.name}</option>`; });

            container.innerHTML = `
                <h3>🛒 سلة المشتريات</h3>
                ${itemsHtml}
                <hr style="margin:15px 0;">
                <div style="background:#f1f5f9; padding:15px; border-radius:8px;">
                    <h3>📍 معلومات التوصيل وإتمام الطلب</h3>
                    <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="order-fullname"></div>
                    <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="order-phone"></div>
                    <div class="form-group"><label>الولاية:</label><select id="order-wilaya" onchange="updateDeliveryFees(${subtotal})">${wilayasOptions}</select></div>
                    <div class="form-group"><label>البلدية / الحي:</label><input type="text" id="order-commune"></div>
                    <div class="form-group">
                        <label>طريقة التوصيل:</label>
                        <select id="order-delivery-type" onchange="updateDeliveryFees(${subtotal})">
                            <option value="توصيل للمنزل">توصيل للمنزل 🏠</option>
                            <option value="توصيل للمكتب (العامل)">توصيل للمكتب (السعر الأرخص) 🏢</option>
                        </select>
                    </div>
                    <div class="form-group"><label>ملاحظات إضافية (اختياري):</label><textarea id="order-notes" placeholder="أي تفاصيل خاصة بالطلب..."></textarea></div>
                    
                    <div style="font-size:15px; margin-top:10px;">
                        <div style="display:flex; gap:6px; margin-bottom:6px;"><input type="text" id="coupon-code" placeholder="كود الخصم" style="flex:1; text-transform:uppercase;"><button type="button" onclick="applyCoupon(${subtotal})" style="padding:8px 14px; background:#475569; color:white; border:none; border-radius:6px;">تطبيق</button></div>
                        <p id="coupon-msg" style="font-size:12px; margin:0 0 6px;"></p>
                        <p>مجموع المنتجات: <b id="cart-subtotal">${subtotal}</b> دج</p>
                        <p id="discount-row" style="display:none; color:#16a34a;">الخصم: <b id="discount-display">0</b> دج</p>
                        <p>سعر التوصيل: <b id="delivery-fee-display">0</b> دج</p>
                        <p style="font-size:18px; color:#e11d48;">المجموع النهائي: <b id="cart-final-total">${subtotal}</b> دج</p>
                    </div>
                    <button onclick="submitOrder(${subtotal})" style="background:#27ae60; color:white; width:100%; padding:14px; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px;">تأكيد وإرسال الطلب الآن 🚀</button>
                </div>
            `;
            switchPage('cart-page'); watchAbandoned();
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            saveCartToStorage();
            openCartPage();
        }

        window.updateDeliveryFees = function(subtotal) {
            let wilayaName = document.getElementById('order-wilaya').value;
            let deliveryType = document.getElementById('order-delivery-type').value;
            let wObj = algeriaWilayas.find(w => w.name === wilayaName);
            let fee = 0;
            if(wObj) { fee = deliveryType.includes('المكتب') ? wObj.desk : wObj.home; }
            let after = subtotal - currentDiscount;
            if(themeCfg.freeShipMin && after >= Number(themeCfg.freeShipMin)) fee = 0;
            document.getElementById('delivery-fee-display').innerText = fee;
            document.getElementById('cart-final-total').innerText = after + fee;
        }

        window.submitOrder = async function(subtotal) {
            let fullName = document.getElementById('order-fullname').value.trim();
            let phone = document.getElementById('order-phone').value.trim();
            let wilaya = document.getElementById('order-wilaya').value;
            let commune = document.getElementById('order-commune').value.trim();
            let deliveryType = document.getElementById('order-delivery-type').value;
            let notes = document.getElementById('order-notes').value.trim();
            let fee = Number(document.getElementById('delivery-fee-display').innerText);
            const trackCode = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join('');

            if(!fullName || !phone || !wilaya || !commune) { alert('يرجى تعبئة كافة حقول التوصيل الإجبارية!'); return; }

            let orderData = {
                fullName, phone, wilaya, commune, deliveryType, notes,
                cartItems: cart,
                productName: cart.map(i => `${i.productName} (×${i.quantity})`).join(', '),
                quantity: cart.reduce((s, i) => s + i.quantity, 0),
                subtotal, deliveryFee: fee, discount: currentDiscount, coupon: currentCoupon ? currentCoupon.code : '', finalTotal: subtotal - currentDiscount + fee, trackCode,
                status: 'جديد ⏳', createdAt: new Date()
            };

            try {
                const orderRef = await addDoc(collection(db, "orders"), orderData);
                trackEvent('Purchase', { value: orderData.finalTotal, currency: 'DZD', content_type: 'product', num_items: orderData.quantity }, orderRef.id);
                localStorage.setItem('dz_user_has_ordered', 'true');
                setDoc(doc(db, 'tracking', trackCode), { status: orderData.status, createdAt: new Date(), total: orderData.finalTotal }).catch(()=>{});
                if(currentCoupon) updateDoc(doc(db, 'coupons', currentCoupon.code), { used: (currentCoupon.used || 0) + 1 }).catch(()=>{});
                setDoc(doc(db, 'carts', deviceId()), { converted: true }, { merge: true }).catch(()=>{});
                cart = []; saveCartToStorage();
                alert('تم إرسال طلبك بنجاح! سنتصل بك قريباً لتأكيد الطلب 🚀\n' + tr('كود تتبع طلبك:') + ' ' + trackCode);
                switchPage('home-page');
            } catch(e) {
                alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.');
            }
        }
    </script>
</body>
</html>
